name: vpk
description: Velopack's packing tool, at the version in VPK_VERSION.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - shell: bash
      run: |
        dotnet tool install -g vpk --version "$VPK_VERSION"
        tools=$HOME/.dotnet/tools
        [[ $RUNNER_OS != Windows ]] || tools=$(cygpath -w "$tools")
        echo "$tools" >> "$GITHUB_PATH"
