name: ci

on:
  push:
  pull_request:

env:
  CHECKOUT: |
    git init -q .
    git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
    git fetch -q --depth 1 origin "$GITHUB_SHA"
    git checkout -q FETCH_HEAD

jobs:
  check:
    runs-on: ubuntu-20.04
    container:
      image: git.wiseless.net/wisetalk/flutter-ci:3.47.7
    steps:
      - name: Checkout
        run: sh -c "$CHECKOUT"
      - name: Rust bridge
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          # flutter test loads the library from here.
          cargo build --release --locked
      - run: flutter pub get --enforce-lockfile
      - name: Bindings are up to date
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Tags v* become a release on this repository with the app attached,
  # where the web client's Download button finds it. Windows and macOS
  # builds join once there are runners for them.
  linux:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-20.04
    container:
      image: git.wiseless.net/wisetalk/flutter-ci:3.47.7
    env:
      TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        run: sh -c "$CHECKOUT"
      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          flutter build linux --release --build-name="${version%%-*}"
          scripts/appimage.sh "$version"
      - run: scripts/release-upload.sh dist/*.AppImage

  android:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-20.04
    container:
      image: git.wiseless.net/wisetalk/flutter-ci:3.47.7
    env:
      TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        run: sh -c "$CHECKOUT"
      # Never publish an APK signed with a throwaway key: phones would refuse
      # every later update.
      - name: Release key
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are missing" >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/key.properties
      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          base=${version%%-*}
          major=${base%%.*}; rest=${base#*.}; minor=${rest%%.*}; patch=${rest#*.}
          # One APK for every phone: arm64, arm and x86_64 in one file.
          flutter build apk --release --build-name="$base" \
            --build-number=$((major * 1000000 + minor * 1000 + patch))
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Wisetalk-$version.apk"
      - run: scripts/release-upload.sh dist/*.apk
