[package]
name = "wisetalk_bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Dart bindings for wisetalk-core, generated with flutter_rust_bridge"
publish = false

[lib]
# staticlib for iOS/macOS, cdylib for Android, Linux and Windows, rlib for
# the Rust tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.23.1"
# Pinned: the Dart package flutter_rust_bridge must be the very same version.
flutter_rust_bridge = "=2.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde_json = "1.0.151"
uuid = "1.26.1"
wisetalk-core = { git = "https://git.wiseless.net/Wisetalk/core.git", branch = "master", version = "1.6.0" }

# Pictures pasted into chats. Phones paste through the keyboard instead.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
# Shortcuts that work while another app is in front (WLK-30): RegisterHotKey
# on Windows, Carbon on macOS, XGrabKey on X11.
global-hotkey = "0.8"
# Desktop updates: the app installs, updates and restarts through Velopack.
velopack = "1.2.161"

# Global shortcuts register on the main thread on macOS, and on a thread of
# their own that pumps messages on Windows (src/api/hotkeys.rs).
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"

# Sound cues on the chosen output (WLK-8): PulseAudio is loaded at run
# time with dlopen.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# Set by flutter_rust_bridge's code generator while it expands the API.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

# Small and fast native library: the app should cost users next to nothing.
# Panics still unwind, flutter_rust_bridge turns them into Dart exceptions.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
