# Used by rustup (needed by flutter_rust_bridge's build hooks), ignored by a
# distribution cargo. Targets cover every platform the client ships on.
[toolchain]
channel = "1.98.1"
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
